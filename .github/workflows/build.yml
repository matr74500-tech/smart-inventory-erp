name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - run: bun install
      - run: bun run build
      - run: ls -la .vercel/output/static
      - run: bun add -D @capacitor/cli @capacitor/core @capacitor/android
      - name: Prepare Capacitor entry point
        run: |
          printf '%s\n' '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Inventory ERP</title></head><body></body></html>' > .vercel/output/static/index.html
      - run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          ls -la android/gradlew
      - run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
