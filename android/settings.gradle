pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "smartinventoryerp"
include ":app"

def nodeModulesDir = new File("$rootDir/../node_modules")
if (nodeModulesDir.exists()) {
    include(":capacitor-android")
    project(":capacitor-android").projectDir = new File(nodeModulesDir, "@capacitor/android/capacitor-android")
}
